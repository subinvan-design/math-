# GitHub Actions Workflow for Math Adventure (수학 탐험대) CI/CD
name: Math Adventure CI/CD

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Lint and Type Check
      run: npm run lint

    - name: Build application
      run: npm run build
      env:
        # Injects a dummy key for compile-time checking if needed, 
        # though build doesn't require runtime connection
        GEMINI_API_KEY: "dummy-key-for-ci"

    # [optional] Archive production build artifacts so you can access them via GitHub Actions UI
    - name: Upload production artifacts
      uses: actions/upload-artifact@v4
      with:
        name: production-build
        path: |
          dist
          package.json

  deploy:
    # This step runs only after a successful build-and-test on the main branch
    needs: build-and-test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # === 배포 환경에 맞는 설정을 활성화하여 사용하세요 ===
